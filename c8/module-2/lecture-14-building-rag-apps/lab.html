<!--
  The Lecture 14 RAG Lab (code track). Nine levels. One thing per screen, in this order:
  guess, finish one marked line of Python, see the result, answer one interview question aloud.
  The first screen is a one-page brief: the pile, the ten questions (A and B are the Retrieval Bench Q2 and Q3), and a sample of each screen.
  The headline is the instruction (coral dot) or the finding (plain). Continue appears only when the screen's one action is done.
  Python runs in the page (Pyodide, assets/lab-worker.js) against checks on the 183 passages of the Retrieval Bench.
  Only level 7 talks to the LLM (the learner's own Groq key, through /api/retrieve, exactly as on the bench).
  No rail, no table, no points: see the Evals Lab UI rules. data-nolabel keeps code out of analytics replays.
-->
